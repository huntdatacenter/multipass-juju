package_update: true

packages:
  - python3-pip
  - jq
  - tox
  - gnome-keyring
  - unzip

write_files:
  - path: /etc/sysctl.d/99-k8s.conf
    content: |
      # Kubernetes and LXD both need plenty of inotify watches
      fs.inotify.max_user_instances = 1024
      fs.inotify.max_user_watches = 1048576
  - path: /usr/local/bin/deploy-ck8s
    permissions: "0755"
    content: |
      #!/bin/bash
      # Deploy single-node Charmed Kubernetes (k8s charm) onto this VM and register it as Juju k8s cloud.
      # The VM itself is added to the lxd controller as a manual machine, since k8s cannot run in LXD containers.
      set -euo pipefail

      CONTROLLER=${CONTROLLER:-lxd}
      MACHINE_MODEL=${MACHINE_MODEL:-ck8s}
      K8S_CHANNEL=${K8S_CHANNEL:-1.36/candidate}
      K8S_BASE=${K8S_BASE:-ubuntu@$(. /etc/os-release && echo $VERSION_ID)}
      K8S_CLOUD=${K8S_CLOUD:-ck8s}
      K8S_MODEL=${K8S_MODEL:-k8s-dev}
      KUBECTL="sudo k8s kubectl"

      mem_kb=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
      if (( mem_kb < 7000000 )); then
        echo "ERROR: Charmed Kubernetes needs at least 8G of memory, recreate VM with: make up-k8s" >&2
        exit 1
      fi

      HOST_IP=$(ip -4 route get 1.1.1.1 | awk '{for (i=1; i<NF; i++) if ($i == "src") print $(i+1)}')

      # Authorize juju client keys to ssh into this VM (needed by manual provisioning)
      juju controllers > /dev/null
      mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys
      for key in ~/.local/share/juju/ssh/*.pub; do
        grep -qxF "$(cat "$key")" ~/.ssh/authorized_keys || cat "$key" >> ~/.ssh/authorized_keys
      done
      chmod 600 ~/.ssh/authorized_keys

      juju show-model "$CONTROLLER:$MACHINE_MODEL" &> /dev/null \
        || juju add-model "$MACHINE_MODEL" localhost --controller "$CONTROLLER" --no-switch

      machine=$(juju machines -m "$CONTROLLER:$MACHINE_MODEL" --format json | jq -r '.machines // {} | keys[0] // empty')
      if [ -z "$machine" ]; then
        echo "# Adding VM ($HOST_IP) as manual machine"
        juju add-machine -m "$CONTROLLER:$MACHINE_MODEL" "ssh:ubuntu@$HOST_IP"
        machine=$(juju machines -m "$CONTROLLER:$MACHINE_MODEL" --format json | jq -r '.machines | keys[0]')
      fi

      juju show-application -m "$CONTROLLER:$MACHINE_MODEL" k8s &> /dev/null \
        || juju deploy -m "$CONTROLLER:$MACHINE_MODEL" k8s --channel "$K8S_CHANNEL" --base "$K8S_BASE" --to "$machine"

      echo "# Waiting for k8s to become active (watch progress with: juju status -m $MACHINE_MODEL)"
      juju wait-for application -m "$CONTROLLER:$MACHINE_MODEL" k8s --query 'status=="active"' --timeout 60m

      echo "# Waiting for node and default storage class"
      $KUBECTL wait --for condition=Ready node --all --timeout 15m
      for _ in $(seq 90); do
        $KUBECTL get storageclass -o json \
          | jq -e '.items[] | select(.metadata.annotations["storageclass.kubernetes.io/is-default-class"] == "true")' > /dev/null \
          && break
        sleep 10
      done

      mkdir -p ~/.kube
      sudo k8s config > ~/.kube/config
      chmod 600 ~/.kube/config

      juju clouds --controller "$CONTROLLER" --format json | jq -e --arg cloud "$K8S_CLOUD" 'has($cloud)' > /dev/null \
        || sudo k8s config | juju add-k8s "$K8S_CLOUD" --controller "$CONTROLLER"

      juju show-model "$CONTROLLER:$K8S_MODEL" &> /dev/null \
        || juju add-model "$K8S_MODEL" "$K8S_CLOUD" --controller "$CONTROLLER"
      juju switch "$CONTROLLER:$K8S_MODEL"

      echo "# Charmed Kubernetes is ready: deploy k8s charms into model '$K8S_MODEL', kubectl uses ~/.kube/config"

bootcmd:
  - printf "[Resolve]\nDNS=1.1.1.1\n" > /etc/systemd/resolved.conf
  - [systemctl, restart, systemd-resolved]

snap:
  commands:
    - snap install multipass-sshfs
    - snap install yq
    - snap install kubectl --classic
    # - snap install lxd --channel=5.0/stable
    - snap install juju --channel=4.0/stable
    - snap install charmcraft --classic --channel=latest/stable

runcmd:
  - DEBIAN_FRONTEND=noninteractive apt -y upgrade

  - |
    # disable swap
    sysctl -w vm.swappiness=0
    echo "vm.swappiness = 0" | tee -a /etc/sysctl.conf
    swapoff -a

  - |
    # disable unnecessary services
    systemctl disable man-db.timer man-db.service --now
    systemctl disable apport.service apport-autoreport.service  --now
    systemctl disable apt-daily.service apt-daily.timer --now
    systemctl disable apt-daily-upgrade.service apt-daily-upgrade.timer --now
    systemctl disable unattended-upgrades.service --now
    systemctl disable motd-news.service motd-news.timer --now
    systemctl disable bluetooth.target --now
    systemctl disable ua-messaging.service ua-messaging.timer --now
    systemctl disable ua-timer.timer ua-timer.service --now
    systemctl disable systemd-tmpfiles-clean.timer --now

  - |
    # apt cleanup
    apt remove -y landscape-client landscape-common
    apt-get autoremove -y

  - |
    adduser ubuntu lxd

  - |
    # setup charmcraft
    lxd init --auto
    # lxd init --auto --storage-backend zfs --storage-create-loop 30 --storage-pool lxd
    # lxc network set lxdbr0 ipv6.address none

  - |
    # Make sure juju directory is there
    sudo -u ubuntu HOME=/home/ubuntu bash -c "curl -LsSf https://astral.sh/uv/install.sh -o /tmp/uv.sh && sh /tmp/uv.sh"
    sudo -u ubuntu mkdir -p /home/ubuntu/.local/share/juju
    sudo -u ubuntu HOME=/home/ubuntu juju
    sudo -u ubuntu bash -c "echo alias watch-juju=\'juju status --watch 3s --storage\' >> /home/ubuntu/.bashrc"
    sudo -u ubuntu bash -c "echo '[ -z "\$TMUX" ] && exec tmux new-session -A -s workspace' >> /home/ubuntu/.bashrc"

  # - |
  #   # Bootstrap juju controller
  #   sudo -u ubuntu HOME=/home/ubuntu juju
  #   sudo -u ubuntu HOME=/home/ubuntu juju bootstrap localhost lxd
  #   # Juju bootstrap was moved to Makefile, to allow interacting with VM while bootstrapping happens

final_message: "The system is finally up, after $UPTIME seconds"
